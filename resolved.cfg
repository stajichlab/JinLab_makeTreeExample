params {
   seq_type = 'protein'
   input = null
   prefix = null
   markerset = 'fungi_odb12'
   enable_iqtree = false
   enable_raxml = false
   outdir = 'results'
   publish_mode = 'copy'
   phyling_db = null
   top_n_to_keep = 80
   rcluster = 10
   bs_count = 1000
   alrt_count = 1000
   iqtree_max_cpus = 16
   fasttree_max_cpus = 8
   fasttree_model_prot = '-lg'
   fasttree_model_dna = '-gtr'
   fasttree_boot = 1000
   pars_trees = 10
   bs_trees_cds = 500
   bs_trees_pep = 100
   raxml_min_cpus = 2
   raxml_max_cpus = 32
   max_cpus = 4
   max_memory = '14 GB'
   max_time = '3d'
}

nextflow {
   enable {
      dsl = 2
   }
}

process {
   cache = 'lenient'
   errorStrategy = { task.exitStatus in [140, 143, 137, 104, 134, 139] ? 'retry' : 'finish' }
   maxRetries = 2
   maxErrors = '-1'
   withName:'IQTREE_.*|RAXMLNG_.*|FASTTREE' {
      errorStrategy = { task.exitStatus in [140, 143, 137, 104, 134, 139] ? 'retry' : 'ignore' }
   }
   withLabel:process_high_memory {
      memory = { 64.GB * task.attempt }
      cpus = 24
      time = { 3.d  * task.attempt }
      queue = 'highmem'
   }
   withLabel:process_high {
      memory = { 64.GB * task.attempt }
      cpus = 48
      time = { 3.d * task.attempt }
   }
   withLabel:process_medium {
      memory = { 48.GB  * task.attempt }
      cpus = 24
      time = { 2.d  * task.attempt }
   }
   withLabel:process_low {
      memory = { 16.GB  * task.attempt }
      cpus = 2
      time = { 2.h }
   }
   withLabel:process_short {
      memory = { 8.GB  * task.attempt }
      cpus = 2
      time = { 2.h  }
      queue = 'short'
   }
   withLabel:process_tree {
      memory = { 48.GB  * task.attempt }
      cpus = 12
      time = { 2.d * task.attempt }
   }
   executor = 'slurm'
   withName:'PHYLING_DOWNLOAD|PHYLING_ALIGN|PHYLING_FILTER|PHYLING_TREE' {
      container = 'quay.io/biocontainers/phyling:2.3.1--pyhdfd78af_0'
   }
   withName:PHYKIT_CONCAT {
      container = 'quay.io/biocontainers/phykit:2.1.93--pyhdfd78af_0'
      queue = 'short'
   }
   withName:MODELTEST_NG {
      container = 'quay.io/biocontainers/modeltest-ng:0.1.7--hf316886_3'
      cpus = 16
      memory = '32 GB'
   }
   withName:'IQTREE_MF|IQTREE_BOOTSTRAP' {
      container = 'quay.io/biocontainers/iqtree:3.1.2--h8471819_0'
   }
   withName:FASTTREE {
      container = 'quay.io/biocontainers/fasttree:2.2.0--h7b50bb2_1'
   }
   withName:'RAXMLNG_PARSE|RAXMLNG_ALL' {
      container = 'quay.io/biocontainers/raxml-ng:2.0.2--h870a6a7_0'
   }
   withName:PHYLING_ALIGN {
      queue = 'short'
      memory = '48 GB'
      cpus = 24
   }
   withName:PHYLING_FILTER {
      cpus = 24
   }
   withName:PHYLING_TREE {
      cpus = 24
   }
   withName:RAXMLNG_PARSE {
      cpus = 1
   }
   queue = 'short'
   time = '2h'
   withName:'.*' {
      queue = 'short'
      time = '2h'
   }
}

singularity {
   enabled = true
   autoMounts = true
}

timeline {
   enabled = true
   file = 'results/pipeline_info/null.protein.fungi_odb12.timeline.html'
   overwrite = true
}

trace {
   enabled = true
   file = 'results/pipeline_info/null.protein.fungi_odb12_trace.txt'
   overwrite = true
   fields = 'task_id,name,status,exit,realtime,%cpu,rss,tag'
}

report {
   enabled = true
   file = 'results/pipeline_info/null.protein.fungi_odb12.report.html'
   overwrite = true
}

dag {
   enabled = true
   file = 'results/pipeline_info/null.protein.fungi_odb12.dag.svg'
   overwrite = true
}
